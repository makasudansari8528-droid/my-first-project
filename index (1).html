<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Fun Page</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Arial, sans-serif;
      color: #f8fafc;
      background: linear-gradient(135deg, #111827, #312e81);
    }
    .card {
      width: min(90%, 520px);
      padding: 42px 30px;
      text-align: center;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 22px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    h1 { margin-top: 0; font-size: 2.2rem; }
    p { color: #dbeafe; line-height: 1.6; }
    button {
      margin-top: 16px;
      padding: 12px 22px;
      border: 0;
      border-radius: 999px;
      background: #a5b4fc;
      color: #1e1b4b;
      font-weight: bold;
      cursor: pointer;
    }
    button:hover { background: #c7d2fe; transform: translateY(-1px); }
    #message { min-height: 52px; margin-top: 22px; font-size: 1.1rem; }
    footer { margin-top: 28px; color: #cbd5e1; font-size: .85rem; }
  </style>
</head>
<body>
  <main class="card">
    <h1>✨ Welcome to My Fun Page</h1>
    <p>A small HTML, CSS, and JavaScript project. Click the button to discover a random message.</p>
    <button id="surpriseBtn">Surprise Me</button>
    <div id="message" aria-live="polite">Your surprise is waiting...</div>
    <footer>Made with HTML, CSS & JavaScript</footer>
  </main>

  <script>
    const messages = [
      "Keep learning. Small steps lead to big results! 🚀",
      "Every expert was once a beginner. 🌱",
      "Your next idea could become something amazing. 💡",
      "Take a break, recharge, and keep going. 🌟",
      "Build something today that you will be proud of. 🛠️"
    ];

    document.getElementById("surpriseBtn").addEventListener("click", () => {
      const randomIndex = Math.floor(Math.random() * messages.length);
      document.getElementById("message").textContent = messages[randomIndex];
    });
  </script>
</body>
</html>
